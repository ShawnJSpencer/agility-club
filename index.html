<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agility Club">
<meta name="theme-color" content="#182433">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Spencer Agility Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: ring-side clipboard — sticky money/level bar and tabs, one column of panels and dog cards, full-width course canvas with thumb pads */
:root{
  --sky:#dcecf3; --turf:#3f8a3c; --ink:#182433; --muted:#566576;
  --panel:#ffffff; --line:#c9d8e0; --ribbon:#2a5fc4; --bar:#e2552d; --gold:#f2bf2e; --fault:#c8321e; --girl:#c2417e;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--sky);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:820px;margin:0 auto;padding-block:0 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.05}h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:0}
.eyebrow{font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ribbon)}
.lede{color:var(--muted);max-width:62ch}
.sub{font-size:.86rem;color:var(--muted)}
.warn{color:var(--fault)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#view{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.intro{display:flex;flex-direction:column;gap:4px;padding-top:6px}
/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px)) 0;display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:820px;margin:0 auto;width:100%}
.brand{font-family:var(--display);font-size:1.1rem;margin-right:auto}
.pill{font-weight:800;font-size:.82rem;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.pill.money{background:var(--gold);color:var(--ink)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:820px;margin:0 auto;width:100%;scrollbar-width:none}
.tabs button{flex:1 0 auto;font:inherit;font-weight:800;font-size:.85rem;color:#cfd8e2;background:none;border:0;padding:8px 10px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--gold)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card[data-open]{cursor:pointer}
.card[data-open]:hover{border-color:#9fb6c4}
.card[aria-selected="true"]{border-color:var(--ribbon);box-shadow:0 0 0 3px rgba(42,95,196,.25)}
.pc{width:100%;height:120px;border-radius:9px;background:linear-gradient(#e6f2f7 0 74%,#7fb874 74%)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h3,.top h2{overflow-wrap:anywhere}
.sex{font-weight:800;font-size:.78rem;white-space:nowrap;border-radius:999px;padding:1px 8px}
.sex.m{color:var(--ribbon);background:#e3ecfb}.sex.f{color:var(--girl);background:#fbe6ef}
.pup{color:#9a5a00;font-weight:800}
.stats{display:grid;grid-template-columns:auto 1fr 2.2em;gap:3px 8px;align-items:center;font-size:.78rem;font-weight:700}
.stats b{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:#e6edf1;overflow:hidden;display:block}
.meter i{display:block;height:100%;background:var(--turf)}
.meter i.range{background:var(--ribbon)}
.btn{font-family:var(--display);font-size:1.05rem;border:0;border-radius:12px;padding:10px 16px;background:var(--ribbon);color:#fff;cursor:pointer;touch-action:manipulation}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.95rem}
.btn.big{padding:16px 26px;font-size:1.3rem;background:var(--turf)}
.btn.danger{background:var(--fault)}
.btn:disabled{opacity:.42;cursor:default}
.btn.sel{margin-top:4px}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ribbon);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
input[type=text]{font:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--line);border-radius:10px;flex:1 1 160px;min-width:0;color:var(--ink);background:#fff}
.namebar{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px solid var(--line);position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px rgba(24,36,51,.15)}
.namebar label{font-weight:800}
.panel,.detail{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.detail{border-color:var(--ribbon)}
.dhead{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:12px;align-items:center}
.dmeta{display:flex;flex-direction:column;gap:6px;min-width:0}
.bigpc{width:100%;height:150px;border-radius:10px;background:linear-gradient(#e6f2f7 0 74%,#7fb874 74%)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.78rem;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.chip.on{background:var(--turf);border-color:var(--turf);color:#fff}
.rec{font-variant-numeric:tabular-nums}
.confirm{background:#fff4f1;border:2px solid #f0c3b8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini{display:flex;align-items:center;gap:8px;background:#f4f8fa;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;cursor:pointer;font:inherit;color:inherit;text-align:left;min-width:0}
.mini:disabled{opacity:.5;cursor:default}
.mini[aria-pressed="true"]{border-color:var(--ribbon);background:#e3ecfb}
.mini span{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.mini small{color:var(--muted);font-size:.75rem}
.mpc{width:64px;height:48px;border-radius:8px;background:linear-gradient(#e6f2f7 0 74%,#7fb874 74%)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.skill{font:inherit;text-align:left;background:#f4f8fa;border:2px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;color:inherit}
.skill b{font-size:.9rem}
.skill[aria-pressed="true"]{border-color:var(--ribbon);background:#e3ecfb}
.skill.done{background:#e6f3e3;border-color:#a9cfa1}
.dots{display:flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;background:#d3dde3}.dots i.on{background:var(--turf)}
#tcv{width:100%;height:220px;border-radius:12px;display:block}
.timing{position:relative;height:26px;border-radius:13px;background:#e6edf1;overflow:hidden;border:2px solid var(--line)}
.zone{position:absolute;top:0;bottom:0;background:#8fd07f}
.marker{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
.courses{display:flex;flex-direction:column;gap:8px}
.course{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.course .sub{font-variant-numeric:tabular-nums}
.course.lock{opacity:.6}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font-weight:800;border-radius:12px;padding:10px 16px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.whobtn{all:unset;cursor:pointer;font-size:.78rem;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;white-space:nowrap}
.whobtn:focus-visible{outline:3px solid var(--gold)}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.whocard{font:inherit;color:inherit;cursor:pointer;background:var(--panel);border:3px solid var(--line);border-top:10px solid var(--pc);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.whocard:hover{border-color:var(--pc)}
.whocard b{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--pc)}
.whocard small{color:var(--muted);font-size:.8rem;font-weight:700}
.wpc,.wnew{width:100%;height:110px;border-radius:10px;background:linear-gradient(#e6f2f7 0 74%,#7fb874 74%)}
.wnew{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800;background:#eef3f6}
/* run */
#run{padding-top:14px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-variant-numeric:tabular-nums}
.hud div{background:var(--panel);border-radius:10px;padding:6px 8px;text-align:center;border:2px solid var(--line)}
.hud small{display:block;font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud span{font-family:var(--display);font-size:1.3rem}
.hud .bad span{color:var(--fault)}
#stage{position:relative}
#cv{display:block;width:100%;border-radius:14px;touch-action:none;background:var(--turf)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{font-family:var(--display);font-size:1.5rem;padding:20px 10px;border-radius:16px;border:0;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.pad small{display:block;font-family:var(--body);font-size:.75rem;font-weight:700;opacity:.85}
.pad.jump{background:var(--bar)}.pad.weave{background:var(--ribbon)}
.pad:active{transform:scale(.97)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(24,36,51,.5);border-radius:14px;overflow:auto}
.result{background:var(--panel);border-radius:16px;padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:8px;text-align:center}
.result table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
.result th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:2px 4px}
.result td{padding:4px;border-top:1px solid var(--line);text-align:left}
.result td small{color:var(--muted)}
.result tr.me td{background:#e3ecfb;font-weight:800}
.ribbonbig{font-family:var(--display);font-size:1.7rem;color:var(--ribbon)}
.ribbonbig.p1{color:#b5341c}.ribbonbig.p2{color:#3d6e2f}
.lvl{font-weight:800;color:#9a5a00}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lineup div{display:flex;flex-direction:column;align-items:center;min-width:0}
.lineup small{color:var(--muted);font-size:.72rem}
.lpc{width:100%;height:70px;border-radius:8px;background:linear-gradient(#e6f2f7 0 74%,#7fb874 74%)}
.help{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.brand{font-size:.95rem}.pill{font-size:.75rem;padding:2px 8px}h1{font-size:1.7rem}.hud span{font-size:1.1rem}.dhead{grid-template-columns:1fr}.overlay{position:fixed;inset:0;border-radius:0;z-index:30}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}
</style>
</head>
<body>

<div id="top" hidden>
  <div class="bar"><span class="brand">Agility Club</span><button class="whobtn" id="whoBtn" hidden></button><span class="pill money" id="pMoney">$0</span><span class="pill" id="pLevel">Level 1</span><span class="pill" id="pHouse">House 1/10</span></div>
  <nav class="tabs"><button data-t="kennel">Kennel</button><button data-t="train">Training</button><button data-t="breed">Breeding</button><button data-t="agility">Agility</button><button data-t="shelter">Shelter</button></nav>
</div>
<div class="wrap">
  <main id="view"></main>
  <section id="run" hidden>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="row" style="justify-content:space-between"><h2 id="runTitle">Novice</h2><button class="btn alt sm" id="quitBtn">Leave ring</button></div>
      <div class="hud">
        <div><small>Time</small><span id="hTime">0.00</span></div>
        <div><small>SCT</small><span id="hSct">0</span></div>
        <div id="hFaultBox"><small>Faults</small><span id="hFaults">0</span></div>
        <div><small>Obstacle</small><span id="hObs">1/1</span></div>
      </div>
      <div id="stage"><canvas id="cv"></canvas><div class="overlay" id="ov" hidden></div></div>
      <div class="pads">
        <button class="pad jump" id="padJump">Jump<small>tap course · space</small></button>
        <button class="pad weave" id="padWeave">Weave<small>tap each pole · W</small></button>
      </div>
      <p class="help">Tap <b>Jump</b> just before bars and the tire. In the weave poles, tap <b>Weave</b> once for each pole. Don't jump on the A-frame or you leap off the yellow contact.</p>
    </div>
  </section>
</div>
<div id="toast" hidden></div>
<script>
(function(){
/* ===== Dog renderer: side view, units of wither height H, ground at y=0, nose toward +x ===== */
const BREEDS=[
 {id:"bc",name:"Border Collie",short:"Border Collie",hc:20,blurb:"Brilliant herding dog. Fast, tight turns and fierce focus.",
  st:{speed:86,jump:80,weave:90,focus:92},len:1.12,leg:1.0,head:1,muz:1,coat:"medium",ears:"tip",tail:"low",
  base:"#1c1e22",white:"#f3f1ec",marks:{collar:1,chest:1,socks:1,blaze:1,tailtip:1,muzzle:1}},
 {id:"sheltie",name:"Shetland Sheepdog",short:"Sheltie",hc:16,blurb:"Light on its feet and eager to please. Great in the weaves.",
  st:{speed:72,jump:72,weave:88,focus:88},len:1.02,leg:.93,head:1,muz:1.18,coat:"long",ears:"tip",tail:"lowfluff",
  base:"#b8772f",saddle:"#6f4116",white:"#f6f2ea",marks:{collar:1,chest:1,socks:1,blaze:1,tailtip:1,mane:1,muzzle:0}},
 {id:"aussie",name:"Australian Shepherd",short:"Aussie",hc:20,blurb:"Powerful all-rounder with lots of spring over the jumps.",
  st:{speed:80,jump:82,weave:72,focus:80},len:1.06,leg:.98,head:1.04,muz:1,coat:"medium",ears:"tip",tail:"bob",
  base:"#8f99a5",spots:"#262b31",tan:"#b2622a",white:"#f3f0ea",marks:{chest:1,socks:1,blaze:1,merle:1,tan:1,muzzle:1}},
 {id:"jrt",name:"Jack Russell Terrier",short:"Jack Russell",hc:12,blurb:"Small, springy and fearless. Bounces over bars.",
  st:{speed:72,jump:88,weave:62,focus:62},len:1.1,leg:.9,head:1.06,muz:.9,coat:"short",ears:"button",tail:"up",
  base:"#f2eee6",head2:"#a5662d",white:"#f2eee6",marks:{headpatch:1,tailpatch:1}},
 {id:"pap",name:"Papillon",short:"Papillon",hc:8,blurb:"Tiny toy dog that loves to work. Nimble feet in the poles.",
  st:{speed:62,jump:70,weave:94,focus:86},len:1.1,leg:.96,head:1.1,muz:.72,coat:"long",ears:"butterfly",tail:"arch",
  base:"#f5f2ec",head2:"#5a3217",white:"#f7f4ef",marks:{headpatch:1,blaze:1,bodypatch:1,mane:1}},
 {id:"mal",name:"Belgian Malinois",short:"Malinois",hc:24,blurb:"Raw speed and huge jumps. Needs steady handling in the weaves.",
  st:{speed:95,jump:90,weave:55,focus:70},len:1.04,leg:1.06,head:1,muz:1.12,coat:"short",ears:"prick",tail:"low",
  base:"#c88e4e",saddle:"#8d5a2a",mask:"#22160d",white:"#f3efe8",marks:{mask:1,saddle:1}}
];
const byId=id=>BREEDS.find(b=>b.id===id);

function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;
 const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
 return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("");}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---- geometry helpers ---- */
function taper(c,pts,w0,w1){ // filled tapered ribbon along polyline
 const n=pts.length,L=[],R=[];
 for(let i=0;i<n;i++){const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
  let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  const w=(w0+(w1-w0)*i/(n-1))/2;L.push({x:p.x-dy*w,y:p.y+dx*w});R.push({x:p.x+dy*w,y:p.y-dx*w});}
 c.beginPath();c.moveTo(L[0].x,L[0].y);L.forEach(p=>c.lineTo(p.x,p.y));
 const e=pts[n-1];c.arc(e.x,e.y,w1/2,0,0);for(let i=n-1;i>=0;i--)c.lineTo(R[i].x,R[i].y);c.closePath();
}
function quad(p0,p1,p2,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push({x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x,y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y});}return o;}
function ik(A,T,l1,l2,bend){let dx=T.x-A.x,dy=T.y-A.y;let d=Math.hypot(dx,dy);d=Math.max(Math.abs(l1-l2)+1e-4,Math.min(l1+l2-1e-4,d));
 const a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));const base=Math.atan2(dy,dx)+bend*a;return{x:A.x+Math.cos(base)*l1,y:A.y+Math.sin(base)*l1};}
function fk(A,lens,angs){const p=[A];let cur=A;lens.forEach((l,i)=>{cur={x:cur.x+Math.sin(angs[i])*l,y:cur.y+Math.cos(angs[i])*l};p.push(cur);});return p;}
const add=(p,dx,dy)=>({x:p.x+dx,y:p.y+dy});
function fringe(c,pts,depth,col,seed){ // jagged fur fringe hanging below a polyline (outward normal = +y)
 const r=rng(seed||7);c.fillStyle=col;c.beginPath();c.moveTo(pts[0].x,pts[0].y);
 pts.forEach(p=>c.lineTo(p.x,p.y));
 for(let i=pts.length-1;i>=0;i--){const p=pts[i],k=Math.sin(i/(pts.length-1)*Math.PI);
  c.lineTo(p.x+(r()-.5)*.03,p.y+depth*(.45+.55*k)*(i%2?1:.6));}
 c.closePath();c.fill();
}

/* ---- poses ---- */
function poseFor(name,t,o){
 o=o||{};const P={name,pitch:0,drop:0,head:"alert",hrot:0,mouth:.25,tail:"wag",flipX:1,flipY:1,tilt:0,eyes:1,t};
 if(name==="run"){const f=o.phase||0;P.phase=f;P.pitch=.035*Math.sin(2*f);P.drop=-.02+.04*Math.abs(Math.cos(f));P.head="run";P.mouth=.9;P.tail="out";}
 else if(name==="air"){P.pitch=o.tilt||0;P.head="run";P.mouth=.6;P.tail="out";}
 else if(["sit","stay","shake","wave","sitpretty"].includes(name)){P.pitch=name==="sitpretty"?1.05:.55;P.head="sit";P.tail=name==="stay"?"still":"wag";P.mouth=name==="stay"?0:.3;}
 else if(name==="down"){P.pitch=-.03;P.head="down";P.mouth=.2;P.tail="still";}
 else if(name==="roll"){P.pitch=-.03;P.head="flat";P.flipY=Math.cos(Math.min(1,t/1.4)*Math.PI*2);P.mouth=.8;P.tail="still";}

 if(b.marks.blaze){c.fillStyle=W;c.beginPath();c.moveTo(.09,-.065);c.quadraticCurveTo(.0,-.12,-.03,-.15);c.quadraticCurveTo(.03,-.16,.12,-.06);c.closePath();c.fill();}
 if(b.marks.tan){c.fillStyle=shade(b.tan,tone*.3);c.beginPath();c.ellipse(.02,.07,.05,.04,0,0,7);c.fill();c.beginPath();c.arc(.03,-.08,.018,0,7);c.fill();}
 // nose
 c.fillStyle="#141010";c.beginPath();c.ellipse(.12+ml,-.01,.032,.026,0,0,7);c.fill();
 c.fillStyle="rgba(255,255,255,.35)";c.beginPath();c.arc(.115+ml,-.022,.008,0,7);c.fill();
 if(mo<=.05){c.strokeStyle="rgba(20,10,8,.6)";c.lineWidth=.007;c.beginPath();c.moveTo(.11+ml,.05);c.quadraticCurveTo(.07+ml*.5,.07,.05,.065);c.stroke();}
 // eye
 const ex=.06,ey=-.035,er=pup?.034:.027;

  c.fillStyle="#0b0806";c.beginPath();c.arc(ex+.004,ey,er*.55,0,7);c.fill();
  c.fillStyle="#fff";c.beginPath();c.arc(ex+.01,ey-.008,er*.28,0,7);c.fill();}
 else{c.strokeStyle="#140c08";c.lineWidth=.01;c.beginPath();c.arc(ex,ey-.01,er,.3,Math.PI-.3);c.stroke();}
 ear(-.01,earCol,1);
 c.restore();

 // near legs
 drawLeg(Rr[1],rw,base,0,1);
 // rear thigh muscle over near leg
 {const K=Rr[1][1];
  if(b.marks.merle){c.fillStyle=shade(b.spots,tone*.5);c.beginPath();c.ellipse((Hj.x+K.x)/2-.02,(Hj.y+K.y)/2-.02,.06,.045,.4,0,7);c.fill();}
  if(b.coat==="long"&&!pup){fringe(c,[{x:Hj.x-.13,y:Hj.y},{x:Hj.x-.12,y:Hj.y+.1},{x:Hj.x-.06,y:Hj.y+.2}],.06,W,(L.seed||1)+11);}}
 drawLeg(F[1],fw,base,0,0);
 // speech
 if(P.name==="speak"&&Math.sin(t*11)>0){c.save();c.translate(HC.x+.35*hf,HC.y-.3*hf);c.scale(1/Math.abs(P.flipX||1),1);c.fillStyle="#182433";c.font="bold .16px Nunito,sans-serif";c.fillText("Woof!",0,0);c.restore();}
 if(P.name==="confused"){c.fillStyle="#182433";c.font="bold .26px Nunito,sans-serif";c.fillText("?",HC.x+.05,HC.y-.42*hf);}
 c.restore();
}

const NAMES=["Ace","Bolt","Pepper","Scout","Juniper","Maple","Ranger","Willow","Dash","Clover","Finn","Hazel","Ziggy","Luna","Remy","Piper","Rocket","Sage","Tess","Moose","Kip","Nova","Bear","Poppy","Rusty","Indie","Banjo","Daisy","Jett","Wren","Comet","Birdie","Tucker","Olive","Rio","Skye","Gus","Ruby","Milo","Fern","Blaze","Penny","Otis","Lark","Zeke","Rosie","Cash","Ivy"];

 try{const a=JSON.parse(localStorage.getItem(KEY)||"null");if(a&&a.v===3&&a.players)return a;}catch(e){}

 tab="kennel";openDog=null;bBoy=bGirl=null;litter=null;trainDog=null;trainSkill=null;runDog=null;pickId=null;confirmRehome=false;

function capacity(lv){return lv<20?10:15+5*Math.floor((lv-20)/10);}

function makeDog(breed,sex,o){
 o=o||{};const b=byId(breed);const st={};
 STATS.forEach(([k])=>st[k]=o.stats?o.stats[k]:clamp(Math.round(b.st[k]+rand(-12,12)),5,99));
 let eye="#3a2412";if((breed==="aussie"&&Math.random()<.35)||(breed==="bc"&&Math.random()<.12))eye="#5f93c6";
 if(o.eye)eye=o.eye;
 return{id:S?S.nextId++:Math.floor(Math.random()*1e9),name:o.name||newName(),breed,sex,stats:st,age:o.age||"adult",
  skills:{},parents:o.parents||null,seed:ri(1,99999),tone:o.tone!=null?o.tone:rand(-.09,.09),eye,
  rec:{runs:0,first:0,second:0,third:0,clean:0}};
}
function fillShelter(){
 BREEDS.forEach(b=>["M","F"].forEach(sx=>{if(!S.shelter.find(d=>d.breed===b.id&&d.sex===sx))S.shelter.push(makeDog(b.id,sx));}));
 S.shelter.sort((a,b)=>BREEDS.findIndex(x=>x.id===a.breed)-BREEDS.findIndex(x=>x.id===b.breed)||(a.sex<b.sex?-1:1));
}
const learned=d=>SKILLS.filter(s=>(d.skills[s.id]||0)>=REPS).length;

/* ---------- portraits ---------- */
const LOOKS=new Map();let lk=0;
function pcanvas(d,pose,cls){const k="k"+(lk++);LOOKS.set(k,{look:lookOf(d),pose:pose||(d.age==="puppy"?"sit":"stand")});return `<canvas class="${cls||"pc"}" data-k="${k}"></canvas>`;}
function paint(root){requestAnimationFrame(()=>{(root||document).querySelectorAll("canvas[data-k]").forEach(cv=>{
 const it=LOOKS.get(cv.dataset.k);if(!it)return;const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
 cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
 const b=it.look.b,sz=.62+.38*b.hc/24;let H=Math.min(h*.5,w*.38)*sz*(it.look.puppy?.72:1);
 drawDog(c,it.look,w*.5-H*.1,h*.92,H,poseFor(it.pose,.4,{}),1);});});}

function statBars(d,cmp){return `<div class="stats">${STATS.map(([k,n])=>`<span>${n}</span><span class="meter"><i style="width:${d.stats[k]}%"></i></span><b>${d.stats[k]}</b>`).join("")}</div>`;}

 $("top").hidden=false;const on=!!(S&&S.started);document.querySelector(".tabs").hidden=!on;["pMoney","pLevel","pHouse"].forEach(i=>$(i).hidden=!on);

 $("pMoney").textContent="$"+S.money;$("pLevel").textContent="Level "+S.level;$("pHouse").textContent=`House ${S.dogs.length}/${capacity(S.level)}`;

function render(){
 LOOKS.clear();header();const v=$("view");
 $("run").hidden=true;v.hidden=false;
 if(!who){v.innerHTML=whoView();bindWho();}
 else if(!S.started){v.innerHTML=startView();bindStart();}
 else if(tab==="kennel"){v.innerHTML=kennelView();bindKennel();}
 else if(tab==="train"){v.innerHTML=trainView();bindTrain();}
 else if(tab==="breed"){v.innerHTML=breedView();bindBreed();}

}

/* ---------- breeding ---------- */
let bBoy=null,bGirl=null,litter=null;
function breedView(){
 if(litter){return `<div class="intro"><p class="eyebrow">Breeding</p><h1>${litter.length} new pupp${litter.length===1?"y":"ies"}!</h1><p class="lede">Name them, then start training. Each puppy needs ${GROW} tricks before it can run agility.</p></div>
  <div class="grid">${litter.map(id=>{const d=dogById(id);return dogCard(d,`<label class="sr" for="pn${id}">Name</label><input type="text" id="pn${id}" maxlength="16" value="${esc(d.name)}">`)}).join("")}</div>
  <div class="row"><button class="btn" id="litterDone">Welcome home</button></div>`;}
 if(bBoy&&!dogById(bBoy))bBoy=null;if(bGirl&&!dogById(bGirl))bGirl=null;
 const ad=d=>d.age==="adult",allB=S.dogs.filter(d=>d.sex==="M"),allG=S.dogs.filter(d=>d.sex==="F");
 const canPair=(d,others)=>ad(d)&&others.some(o=>ad(o)&&o.breed===d.breed);
 // pick the obvious choice so the pair is ready to go
 if(!bBoy){const ok=allB.filter(d=>canPair(d,allG)&&(!bGirl||d.breed===dogById(bGirl).breed));if(ok.length===1)bBoy=ok[0].id;}
 if(!bGirl&&bBoy){const ok=allG.filter(d=>ad(d)&&d.breed===dogById(bBoy).breed);if(ok.length===1)bGirl=ok[0].id;}
 const boy=bBoy&&dogById(bBoy),girl=bGirl&&dogById(bGirl);
 const why=(d,mate)=>!ad(d)?`Puppy · ${learned(d)}/${GROW} tricks`:mate&&mate.breed!==d.breed?"Different breed":"";
 const mini=(d,sel,attr,mate)=>{const w=why(d,mate);return `<button class="mini" ${attr}="${d.id}" aria-pressed="${sel?"true":"false"}" ${w?"disabled":""}>${pcanvas(d,"stand","mpc")}<span><b>${esc(d.name)}</b><small>${byId(d.breed).short}${w?` · ${w}`:""}</small></span></button>`;};
 const boys=allB,girls=allG;
 let preview="";
 if(boy&&girl){preview=`<div class="panel"><h3>Puppy forecast</h3><p class="sub">Puppies land near the average of both parents, give or take 8 points.</p><div class="stats">${STATS.map(([k,n])=>{const m=(boy.stats[k]+girl.stats[k])/2,lo=clamp(Math.round(m-8),5,99),hi=clamp(Math.round(m+8),5,99);
   return `<span>${n}</span><span class="meter"><i class="range" style="margin-left:${lo}%;width:${hi-lo}%"></i></span><b>${lo}–${hi}</b>`}).join("")}</div>
   <div class="row"><button class="btn" id="breedGo" ${room()<3?"disabled":""}>Breed ${esc(boy.name)} and ${esc(girl.name)}</button>${room()<3?`<span class="sub warn">Litters are 1–3 puppies, so you need 3 open spots. You have ${room()}.</span>`:""}</div></div>`;}
 return `<div class="intro"><p class="eyebrow">Breeding</p><h1>Raise a litter</h1><p class="lede">Pick an adult boy and an adult girl of the same breed. Strong parents tend to have strong puppies. A litter has 1 to 3 puppies.</p></div>
 <div class="panel"><h3>Boy</h3>${boys.length?`<div class="minis">${boys.map(d=>mini(d,d.id===bBoy,"data-boy",girl)).join("")}</div>`:`<p class="sub">No boys yet. Adopt one at the shelter.</p>`}</div>
 <div class="panel"><h3>Girl</h3>${girls.length?`<div class="minis">${girls.map(d=>mini(d,d.id===bGirl,"data-girl",boy)).join("")}</div>`:`<p class="sub">No girls yet. Adopt one at the shelter.</p>`}</div>
 ${!(boy&&girl)?`<p class="sub">${!boy&&!girl?"Tap a boy and a girl to pair them.":!boy?"Now tap a boy.":"Now tap a girl."}</p>`:""}
 ${preview}`;
}
function bindBreed(){
 if(litter){$("litterDone").onclick=()=>{litter.forEach(id=>{const v=$("pn"+id).value.trim();if(v)dogById(id).name=v;});litter=null;save();go("kennel");};return;}
 document.querySelectorAll("[data-boy]").forEach(b=>b.onclick=()=>{bBoy=bBoy===+b.dataset.boy?null:+b.dataset.boy;render();});
 document.querySelectorAll("[data-girl]").forEach(b=>b.onclick=()=>{bGirl=bGirl===+b.dataset.girl?null:+b.dataset.girl;render();});
 if($("breedGo"))$("breedGo").onclick=()=>{
  const a=dogById(bBoy),m=dogById(bGirl);if(!a||!m||room()<3)return;

/* ---------- course & physics ---------- */
const GAP={jump:230,tire:240,spread:260,tunnel:250,weave6:240,weave12:240,aframe:250};
const POLE=36;
function buildCourse(c){let x=320;const obs=[];
 c.seq.forEach((t,i)=>{const o={type:t,x,n:i+1};
  o.len=t==="tunnel"?170:t==="aframe"?210:t.startsWith("weave")?((t==="weave6"?6:12)-1)*POLE:t==="spread"?38:0;
  if(t.startsWith("weave"))o.poles=t==="weave6"?6:12;
  obs.push(o);x+=o.len+GAP[t];});
 return{obs,finish:x+40,len:x+40};}
const speedOf=s=>230+s*1.4, weaveSpeedOf=s=>70+s*1.0;
function weaveLen(cr){let w=0;cr.obs.forEach(o=>{if(o.type.startsWith("weave"))w+=o.len+40;});return w;}
function courseSct(cr){const w=weaveLen(cr);return Math.ceil(((cr.len-w)/speedOf(68)+w/weaveSpeedOf(68))*1.15+1);}
function simRun(st,cr,sct){
 const w=weaveLen(cr);let time=((cr.len-w)/speedOf(st.speed)+w/weaveSpeedOf(st.weave))*(1+rand(.02,.12)+(100-st.focus)/1500)+.3;
 let f=0;cr.obs.forEach(o=>{let p;
  if(o.type==="jump"||o.type==="tire")p=.015+(100-st.jump)/650;else if(o.type==="spread")p=.03+(100-st.jump)/450;
  else if(o.type.startsWith("weave"))p=.03+(100-st.weave)/330;else if(o.type==="aframe")p=.02+(100-st.focus)/600;else p=.005;
  if(Math.random()<p)f+=5;});
 const tf=Math.max(0,Math.ceil(time-sct));return{time,faults:f,tf,total:f+tf};}
function rivals(c){return[0,1].map(()=>{const b=pick(BREEDS),st={};STATS.forEach(([k])=>st[k]=clamp(Math.round(rand(c.rival[0],c.rival[1])*.6+b.st[k]*.4),5,99));
 const d={name:pick(NAMES),breed:b.id,sex:Math.random()<.5?"M":"F",stats:st,age:"adult",seed:ri(1,99999),tone:rand(-.09,.09),eye:"#3a2412"};return d;});}

/* ---------- run ---------- */
const cv=$("cv"),ctx=cv.getContext("2d");
let R=null,raf=0,W=600,H=260,K=1,dpr=1,last=0;
function size(){dpr=window.devicePixelRatio||1;const cw=cv.clientWidth;const ch=Math.max(220,Math.min(340,cw*.56));
 cv.style.height=ch+"px";cv.width=cw*dpr;cv.height=ch*dpr;K=ch/260;W=cw/K;H=260;}
window.addEventListener("resize",()=>{if(!$("run").hidden){size();if(R&&!R.running)draw();}});
function startRun(c){
 const d=dogById(runDog);if(!d||d.age!=="adult")return;
 const b=byId(d.breed),cr=buildCourse(c),st=d.stats;
 const barH=b.hc*2.05,Tair=.40+st.jump*.003,h=barH*1.6;
 R={course:c,cr,b,dog:d,look:lookOf(d),x:120,y:0,vy:0,air:false,g:8*h/(Tair*Tair),jv:4*h/Tair,barH,dh:b.hc*2.4+4,
  v:speedOf(st.speed),vw:weaveSpeedOf(st.weave),spd:0,t:0,faults:0,running:false,done:false,ph:0,taps:0,msgs:[],
  sct:courseSct(cr),next:0,go:0,rivals:rivals(c)};
 cr.obs.forEach(o=>{o.knocked=false;o.faulted=false;o.passed=false;o.poleIdx=0;o.fall=0;o.entered=false;});
 $("view").hidden=true;$("run").hidden=false;$("top").hidden=true;window.scrollTo(0,0);
 $("runTitle").textContent=`${c.name} · ${d.name}`;$("hSct").textContent=R.sct;
 size();updHud();draw();
 LOOKS.clear();
 overlay(`<div class="result"><h2>${c.name} course</h2><p class="sub">${cr.obs.length} obstacles · Standard Course Time ${R.sct}s</p>
  <div class="lineup">${[d,...R.rivals].map((x,i)=>`<div>${pcanvas(x,"stand","lpc")}<b>${esc(x.name)}</b><small>${byId(x.breed).short}${i===0?" · yours":""}</small></div>`).join("")}</div>
  <button class="btn" id="goBtn">Leave the start line</button></div>`);
 paint($("ov"));
 $("goBtn").onclick=()=>{overlay(null);R.running=true;R.go=1.2;last=performance.now();raf=requestAnimationFrame(loop);};
}
function overlay(html){const ov=$("ov");if(!html){ov.hidden=true;ov.innerHTML="";return}ov.innerHTML=html;ov.hidden=false;}
$("quitBtn").onclick=()=>{cancelAnimationFrame(raf);R=null;$("top").hidden=false;render();};
function msg(t,col){R.msgs.push({t,col:col||"#fff",age:0});}
function fault(o,why){if(o&&o.faulted)return;if(o)o.faulted=true;R.faults+=5;msg(why+" +5","#ffd9cf");updHud();}
function zoneOf(x){for(const o of R.cr.obs){if(o.len&&x>=o.x-6&&x<=o.x+o.len+6)return o;}return null;}
function surface(x){for(const o of R.cr.obs){if(o.type==="aframe"&&x>=o.x&&x<=o.x+o.len){const m=o.x+o.len/2;return 92*(1-Math.abs(x-m)/(o.len/2));}}return 0;}
function doJump(){if(!R||!R.running||R.done||R.go>0||R.air)return;const z=zoneOf(R.x);
 if(z&&(z.type==="tunnel"||z.type.startsWith("weave")))return;if(z&&z.type==="aframe")fault(z,"Leapt off the A-frame");R.air=true;R.vy=R.jv;}
function doWeave(){if(!R||!R.running||R.done)return;R.taps=Math.min(R.taps+1,2);}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(!R)return;step(dt);draw();updHud();if(R&&R.running)raf=requestAnimationFrame(loop);}
function step(dt){
 if(R.go>0){R.go-=dt;if(R.go>0)return;}
 const z=zoneOf(R.x),inWeave=z&&z.type.startsWith("weave");
 const target=inWeave?R.vw:(z&&z.type==="aframe"?R.v*.85:R.v);
 R.spd+=(target-R.spd)*Math.min(1,dt*(inWeave?8:3));
 const px=R.x;R.x+=R.spd*dt;R.t+=dt;R.ph+=dt*R.spd/(R.dh*.55);
 const sf=surface(R.x);
 if(R.air){R.vy-=R.g*dt;R.y+=R.vy*dt;if(R.y<=sf&&R.vy<0){R.y=sf;R.air=false;R.vy=0;}}else R.y=sf;
 if(inWeave&&!z.entered){z.entered=true;R.taps=Math.min(R.taps,1);}
 for(const o of R.cr.obs){
  if(o.type==="jump"||o.type==="spread"){const bars=o.type==="spread"?[o.x,o.x+o.len]:[o.x];
   bars.forEach((bx,i)=>{if(px<bx&&R.x>=bx&&R.y<R.barH*(o.type==="spread"&&i===1?1.05:1)&&!o.knocked){o.knocked=true;fault(o,"Bar down");}});}
  if(o.type==="tire"&&px<o.x&&R.x>=o.x&&R.y<R.barH*1.15)fault(o,"Missed the tire");
  if(o.type.startsWith("weave")){while(o.poleIdx<o.poles&&R.x>=o.x+o.poleIdx*POLE){if(R.taps>0)R.taps--;else fault(o,"Popped out of the poles");o.poleIdx++;}}
  if(!o.passed&&R.x>o.x+o.len+4){o.passed=true;if(!o.faulted)msg(o.type.startsWith("weave")?"Clean weaves!":o.type==="aframe"?"Hit the contact!":"Nice!","#e6ffd8");}
  if(o.knocked)o.fall=Math.min(1,o.fall+dt*4);
 }
 R.next=R.cr.obs.findIndex(o=>!o.passed);
 R.msgs.forEach(m=>m.age+=dt);R.msgs=R.msgs.filter(m=>m.age<1.3);
 if(R.x>=R.cr.finish&&!R.done)finish();
}
function updHud(){if(!R)return;$("hTime").textContent=R.t.toFixed(2);
 $("hFaults").textContent=R.faults+(R.t>R.sct?Math.ceil(R.t-R.sct):0);$("hFaultBox").className=R.faults||R.t>R.sct?"bad":"";
 const n=R.next<0?R.cr.obs.length:R.next+1;$("hObs").textContent=`${n}/${R.cr.obs.length}`;}
function finish(){
 R.done=true;R.running=false;
 const d=R.dog,c=R.course,tf=Math.max(0,Math.ceil(R.t-R.sct)),total=R.faults+tf,clean=total===0;
 const me={name:d.name,breed:d.breed,time:R.t,faults:R.faults,tf,total,me:true};
 const others=R.rivals.map(x=>{const r=simRun(x.stats,R.cr,R.sct);return{name:x.name,breed:x.breed,...r};});
 const cmp=(a,b)=>a.total-b.total||a.time-b.time;
 let order=clean?[me,...others.sort(cmp)]:[me,...others].sort(cmp);
 const place=order.indexOf(me),prize=PRIZE[place];
 S.money+=prize;d.rec.runs++;d.rec[["first","second","third"][place]]++;
 let lvlMsg="";
 if(clean){const oldCap=capacity(S.level);S.level++;d.rec.clean++;lvlMsg=`<p class="lvl">Level up! You're now level ${S.level}.${capacity(S.level)>oldCap?` Your house holds ${capacity(S.level)} dogs.`:""}</p>`;}
 const key=d.id+":"+c.id,prev=S.best[key];
 if(!prev||total<prev.faults||(total===prev.faults&&R.t<prev.time))S.best[key]={time:+R.t.toFixed(2),faults:total};

 const ord=["1st","2nd","3rd"];
 overlay(`<div class="result"><div class="ribbonbig p${place}">${ord[place]} place</div>
  <p class="sub">${prize?`You won $${prize}.`:"No prize money for 3rd."} ${clean?"Clean run!":`${total} total faults (${R.faults} course, ${tf} time).`}</p>${lvlMsg}
  <table><thead><tr><th></th><th>Dog</th><th>Faults</th><th>Time</th></tr></thead><tbody>
  ${order.map((r,i)=>`<tr class="${r.me?"me":""}"><td>${ord[i]}</td><td>${esc(r.name)}<small> ${byId(r.breed).short}</small></td><td>${r.total}</td><td>${r.time.toFixed(2)}</td></tr>`).join("")}</tbody></table>
  <div class="row center"><button class="btn" id="againBtn">Run again</button><button class="btn alt" id="homeBtn">Back</button></div></div>`);

 $("homeBtn").onclick=()=>{R=null;$("top").hidden=false;render();};
}

/* ---------- draw run ---------- */
function draw(){
 if(!R)return;const c=ctx;c.setTransform(dpr*K,0,0,dpr*K,0,0);
 const gy=H-44,cam=R.x-W*.3;
 let g=c.createLinearGradient(0,0,0,gy);g.addColorStop(0,"#a9d3ea");g.addColorStop(1,"#e4f2f8");c.fillStyle=g;c.fillRect(0,0,W,gy);
 const tc=["#2a5fc4","#e2552d","#f2bf2e","#ffffff","#3f8a3c"];
 for(let i=-1;i<W/90+2;i++){const off=cam*.25,ix=Math.floor(off/90)+i,x=ix*90-off;
  c.fillStyle=tc[((ix%5)+5)%5];c.beginPath();c.moveTo(x,gy-62);c.lineTo(x+40,gy-80);c.lineTo(x+80,gy-62);c.closePath();c.fill();
  c.fillStyle="rgba(24,36,51,.18)";c.fillRect(x+6,gy-62,68,26);c.fillStyle="#7d8a95";c.fillRect(x+4,gy-62,2,26);c.fillRect(x+74,gy-62,2,26);}
 c.fillStyle="#f7fafb";c.fillRect(0,gy-34,W,6);
 for(let i=-1;i<W/50+2;i++){const off=cam*.7,x=(Math.floor(off/50)+i)*50-off;c.fillRect(x,gy-38,4,38);}
 c.fillStyle="#3f8a3c";c.fillRect(0,gy-28,W,H-gy+28);
 for(let i=-1;i<W/60+2;i++){const ix=Math.floor(cam/60)+i,x=ix*60-cam;if(ix%2===0){c.fillStyle="#4a9846";c.fillRect(x,gy-28,60,H);}}
 const sx=x=>x-cam;
 [[90,"START"],[R.cr.finish,"FINISH"]].forEach(([fx,lab])=>{const x=sx(fx);if(x<-40||x>W+40)return;
  c.fillStyle="#fff";c.fillRect(x-2,gy-30,4,40);c.fillRect(x-2,gy-46,4,16);
  c.fillStyle="#182433";c.fillRect(x-26,gy-62,52,16);c.fillStyle="#fff";c.font="12px 'Lilita One',sans-serif";c.textAlign="center";c.fillText(lab,x,gy-50);});
 const front=[];
 R.cr.obs.forEach(o=>{const x=sx(o.x);if(x<-260||x>W+60)return;
  cone(c,x-46,gy+6,o.n,R.next===o.n-1);
  if(o.type==="jump")jumpDraw(c,x,gy,R.barH,o.fall);
  else if(o.type==="spread"){jumpDraw(c,x,gy,R.barH,o.fall);jumpDraw(c,x+o.len,gy,R.barH*1.05,o.fall);}
  else if(o.type==="tire"){tireBack(c,x,gy,R.barH);front.push(()=>tireDraw(c,x,gy,R.barH));}
  else if(o.type==="tunnel")front.push(()=>tunnelDraw(c,x,gy,o.len));
  else if(o.type==="aframe")aframeDraw(c,x,gy,o.len);
  else if(o.type.startsWith("weave"))weaveDraw(c,x,gy,o.poles,front);});
 const z=zoneOf(R.x),inW=z&&z.type.startsWith("weave");
 let P;
 if(!R.running&&!R.done||R.go>0)P=poseFor("stand",performance.now()/1000,{});
 else if(R.air)P=poseFor("air",0,{tilt:Math.max(-.45,Math.min(.45,R.vy/600))});
 else{P=poseFor("run",0,{phase:R.ph});if(z&&z.type==="aframe")P.pitch+=(R.x<z.x+z.len/2?.38:-.38);}

/* ===== Sync (GitHub) — GitHub Pages build only ===== */
const Sync=(()=>{
 const GH={owner:"ShawnJSpencer",repo:"agility-club",branch:"sync-data",path:"sync.json"};
 const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
 const LSg=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
 const LSs=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
 // Same site as Wild Run and the NFL app, so a saved key there is tried first; it only sticks if it can reach agility-club.
 let token=LSg("agility.ghtoken"),borrowed=false;
 if(!token&&LSg("agility.sync")!=="off"){token=LSg("wildrun.ghtoken")||LSg("sfe.ghtoken");borrowed=!!token;if(borrowed)LSs("agility.firstsync","1");}
 let busy=false,again=false,timer=null,status=token?"idle":"off",lastOk=0;
 const hdr=t=>({Authorization:"Bearer "+(t||token),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
 const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
 const b64e=s=>{let x="";new TextEncoder().encode(s).forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
 async function pull(){
  const r=await fetch(`${API}?ref=${GH.branch}&_=${Date.now()}`,{headers:hdr(),cache:"no-store"});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();let data=null;try{data=JSON.parse(b64d(j.content||""))}catch(e){}
  return{data,sha:j.sha};
 }
 async function push(sha){
  const body={message:"sync",content:b64e(JSON.stringify(ALL)),branch:GH.branch};if(sha)body.sha=sha;
  const r=await fetch(API,{method:"PUT",headers:Object.assign(hdr(),{"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return false;
  if(!r.ok)throw new Error(String(r.status));
  return true;
 }
 // Each player's kennel syncs separately: the newer save wins. On a device's first sync, saved kennels win over this device.
 function merge(remote){
  let rp={};
  if(remote&&remote.v===3&&remote.players)rp=remote.players;
  else if(remote&&remote.v===2)rp={emma:remote}; // save from before players existed
  const first=LSg("agility.firstsync")==="1";
  let changed=[],push=!(remote&&remote.v===3);
  PLAYERS.forEach(({id})=>{
   const r=rp[id],l=ALL.players[id];
   const rOk=r&&r.v===2,lStarted=l&&l.started;
   if(rOk&&(!l||(first&&r.started)||(r.u||0)>(l.u||0))){if(l!==r){ALL.players[id]=r;changed.push(id);}}
   else if(lStarted&&(!rOk||(l.u||0)>(r.u||0)))push=true;
  });
  return{changed,push};
 }
 async function run(){
  if(!token)return;
  if(R){clearTimeout(timer);timer=setTimeout(run,5000);return;} // never swap saves mid-run
  if(!navigator.onLine){setStatus("error");return}
  if(busy){again=true;return}
  busy=true;clearTimeout(timer);setStatus("syncing");
  try{
   let ok=false;
   for(let i=0;i<4&&!ok;i++){
    const {data,sha}=await pull();
    if(R)break;
    const m=merge(data);
    if(m.changed.length){saveLocal();
     if(!who)render();
     else if(m.changed.includes(who)){S=ALL.players[who];const keep=tab;usePlayer(who);tab=keep;stopTrain();render();}
     else header();}
    ok=!m.push||await push(sha);
   }
   LSs("agility.firstsync","");
   if(borrowed){LSs("agility.ghtoken",token);borrowed=false;}
   lastOk=Date.now();setStatus("ok");
  }catch(e){
   if(borrowed){token="";borrowed=false;LSs("agility.firstsync","");setStatus("off");}
   else setStatus(["401","403","404"].includes(e.message)?"badtoken":"error");
  }
  busy=false;if(again){again=false;run()}
 }
 function soon(){if(!token)return;clearTimeout(timer);timer=setTimeout(run,1500)}
 function ago(){const s=Math.round((Date.now()-lastOk)/1000);return s<20?"just now":s<3600?Math.round(s/60)+" min ago":"a while ago"}
 function setStatus(s){status=s;paint()}
 function paint(){const b=$("syncBtn");if(!b)return;
  const map={off:["off","Sync iPhone + iPad"],idle:["","Synced"],syncing:["busy","Syncing…"],ok:["","Synced · "+ago()],error:["warn","Offline · will retry"],badtoken:["warn","Sync key not working · tap to fix"]};
  const [cls,txt]=map[status]||map.off;b.className="syncbtn "+cls;b.querySelector("span").textContent=txt;}
 async function check(t){
  const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`,{headers:hdr(t),cache:"no-store"});
  if(r.status===401)return"GitHub didn't accept that key. Make sure you copied the whole thing.";
  if(r.status===404)return"That key can't see the agility-club repo. Give it access to agility-club.";
  if(!r.ok)return"GitHub said "+r.status+". Try again in a minute.";
  const j=await r.json();
  if(j.permissions&&j.permissions.push===false)return'That key is read-only. Set Contents to "Read and write".';
  return"";}
 return{get on(){return!!token},run,soon,paint,check,
  setToken(t){token=t;borrowed=false;LSs("agility.ghtoken",t);LSs("agility.sync",t?"":"off");LSs("agility.firstsync",t?"1":"");status=t?"idle":"off";paint();if(t)run();}};
})();
syncHook=()=>Sync.soon();

 <div class="row"><button class="btn" id="tokPaste">Paste key</button><button class="btn alt" id="tokSave">Save</button><button class="btn alt" id="tokOff" hidden>Turn off sync</button><button class="btn alt" id="tokClose">Close</button></div></div>`;
 document.body.appendChild(sh);
 const msgTok=(t,c)=>{$("tokMsg").textContent=t;$("tokMsg").className="tokmsg "+(c||"");};
 btn.onclick=()=>{$("tok").value="";msgTok("");$("tokOff").hidden=!Sync.on;$("sheetState").textContent=Sync.on?"Sync is on for this device.":"Sync is off for this device. When you turn it on, this device loads the family's saved kennels.";sh.hidden=false;};

  const m=t.match(/(github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]+)/);
